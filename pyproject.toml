[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bon-proxy"
version = "2.0.0"
description = "An OpenAI-compatible Best-of-N proxy (bon-proxy) for vLLM / SGLang backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "openai>=1.50,<3",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
bon-proxy = "bon_proxy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bon_proxy"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

